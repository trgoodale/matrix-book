# Builds the book and publishes it to GitHub Pages whenever main is updated.
# One-time setup: see "Publishing" in README.md.
name: Publish book

on:
  workflow_dispatch:
  push:
    branches: main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render the book
        uses: quarto-dev/quarto-actions/render@v2

      # The website's notebooks are copies with outputs, so readers who
      # download one can see the results before running it. Colab opens the
      # notebooks in the repository, which have no outputs. The code files
      # are regenerated first, so the website matches the chapters even if
      # code/ has not been updated (check-code.yml reports that).
      - name: Add the notebooks and MATLAB scripts, with outputs
        run: |
          python tools/make_code_files.py
          cp -r code/. _book/code/
          python tools/run_notebooks.py --warn-only --save _book/code/python

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
