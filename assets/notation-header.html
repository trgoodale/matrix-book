<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script>
/*
  Notation settings for the book.
  All mathematics is written with the macros below, never with hard-coded notation:
    \vect{v}   a vector            \M{A}      a matrix
    \ui \uj \uk  standard unit vectors in 2D/3D   \ue{n}  general basis vector e_n
    \mat{..}   a matrix in brackets (rows split by \\, entries by &)
    \amat{ccc|c}{..}  an augmented matrix   \T  transpose   \R  real numbers
  The reader's choices are stored in localStorage under "mb-settings" and read
  here, before MathJax loads, so every page is typeset in their notation.
*/
(function () {
  var DEFAULTS = { vec: "bold", mat: "bold", basis: "ijk", br: "round", tr: "T", code: "Python" };
  var s = {};
  try { s = JSON.parse(localStorage.getItem("mb-settings") || "{}") || {}; } catch (e) { s = {}; }
  for (var k in DEFAULTS) if (!(k in s)) s[k] = DEFAULTS[k];
  window.mbSettings = s;
  window.mbDefaults = DEFAULTS;

  var vec = { bold: "\\mathbf{#1}", arrow: "\\vec{#1}", underline: "\\underline{#1}" }[s.vec] || "\\mathbf{#1}";
  var unit = function (letter, dotless, idx) {
    if (s.basis === "e") return vec.replace("#1", "e") + "_{" + idx + "}";
    if (s.basis === "hat") return "\\hat{" + dotless + "}";
    return vec.replace("#1", letter);
  };
  var open = s.br === "square" ? "[" : "(";
  var close = s.br === "square" ? "]" : ")";
  var env = s.br === "square" ? "bmatrix" : "pmatrix";

  window.MathJax = {
    tex: {
      macros: {
        vect: [vec, 1],
        M: [s.mat === "italic" ? "#1" : "\\mathbf{#1}", 1],
        ui: unit("i", "\\imath", 1),
        uj: unit("j", "\\jmath", 2),
        uk: unit("k", "k", 3),
        ue: [vec.replace("#1", "e") + "_{#1}", 1],
        mat: ["\\begin{" + env + "}#1\\end{" + env + "}", 1],
        amat: ["\\left" + open + "\\begin{array}{#1}#2\\end{array}\\right" + close, 2],
        T: s.tr === "top" ? "^{\\top}" : "^{\\mathsf{T}}",
        R: "\\mathbb{R}",
        zerovec: vec.replace("#1", "0")
      }
    },
    // MathJax 4: break long equations across lines to fit narrow screens
    output: { displayOverflow: "linebreak", linebreaks: { inline: true, width: "100%", lineleading: 0.6 } },
    chtml: { scale: 1.0 }
  };

  // Default language for code tabs: Quarto reads this when the page is shown.
  try {
    var key = "quarto-persistent-tabsets-data";
    var tabs = JSON.parse(localStorage.getItem(key) || "{}") || {};
    if (!tabs.language) { tabs.language = s.code; localStorage.setItem(key, JSON.stringify(tabs)); }
  } catch (e) {}

  // ---------- settings panel ----------
  var GROUPS = [
    { key: "vec", label: "Vectors", opts: [["bold", "Bold", "\\mathbf{v}"], ["arrow", "Arrow", "\\vec{v}"], ["underline", "Underlined", "\\underline{v}"]] },
    { key: "mat", label: "Matrices", opts: [["bold", "Bold", "\\mathbf{A}"], ["italic", "Italic", "A"]] },
    { key: "basis", label: "Unit vectors", opts: [["ijk", "i, j, k", "\\mathbf{i},\\ \\mathbf{j},\\ \\mathbf{k}"], ["hat", "Hats", "\\hat{\\imath},\\ \\hat{\\jmath},\\ \\hat{k}"], ["e", "e₁, e₂, e₃", "\\mathbf{e}_1,\\ \\mathbf{e}_2,\\ \\mathbf{e}_3"]] },
    { key: "br", label: "Brackets", opts: [["round", "Round", "\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}"], ["square", "Square", "\\begin{bmatrix}1&2\\\\3&4\\end{bmatrix}"]] },
    { key: "tr", label: "Transpose", opts: [["T", "Letter T", "\\mathbf{A}^{\\mathsf{T}}"], ["top", "Symbol ⊤", "\\mathbf{A}^{\\top}"]] },
    { key: "code", label: "Code shown first", opts: [["Python", "Python", ""], ["MATLAB", "MATLAB", ""]] }
  ];

  function buildForm(prefix) {
    var form = document.createElement("form");
    form.className = "mb-settings-form";
    form.addEventListener("submit", function (e) { e.preventDefault(); });
    GROUPS.forEach(function (g) {
      var fs = document.createElement("fieldset");
      var lg = document.createElement("legend");
      lg.textContent = g.label;
      fs.appendChild(lg);
      g.opts.forEach(function (o) {
        var id = prefix + "-" + g.key + "-" + o[0];
        var lab = document.createElement("label");
        lab.className = "mb-opt";
        lab.htmlFor = id;
        var inp = document.createElement("input");
        inp.type = "radio"; inp.name = prefix + "-" + g.key; inp.id = id; inp.value = o[0];
        inp.checked = s[g.key] === o[0];
        lab.appendChild(inp);
        var txt = document.createElement("span");
        txt.className = "mb-opt-name";
        txt.textContent = o[1];
        lab.appendChild(txt);
        if (o[2]) {
          var ex = document.createElement("span");
          ex.className = "mb-opt-example";
          ex.textContent = "\\(" + o[2] + "\\)";
          lab.appendChild(ex);
        }
        fs.appendChild(lab);
      });
      form.appendChild(fs);
    });
    var row = document.createElement("div");
    row.className = "mb-settings-actions";
    var apply = document.createElement("button");
    apply.type = "button"; apply.className = "btn btn-primary"; apply.textContent = "Apply";
    var reset = document.createElement("button");
    reset.type = "button"; reset.className = "btn btn-outline-secondary"; reset.textContent = "Restore defaults";
    var note = document.createElement("span");
    note.className = "mb-settings-note";
    note.textContent = "Saved in this browser and used on every page.";
    row.appendChild(apply); row.appendChild(reset); row.appendChild(note);
    form.appendChild(row);

    apply.addEventListener("click", function () {
      var next = {};
      GROUPS.forEach(function (g) {
        var c = form.querySelector('input[name="' + prefix + "-" + g.key + '"]:checked');
        next[g.key] = c ? c.value : DEFAULTS[g.key];
      });
      save(next);
    });
    reset.addEventListener("click", function () { save(Object.assign({}, DEFAULTS)); });
    return form;
  }

  function save(next) {
    try {
      localStorage.setItem("mb-settings", JSON.stringify(next));
      var key = "quarto-persistent-tabsets-data";
      var tabs = JSON.parse(localStorage.getItem(key) || "{}") || {};
      tabs.language = next.code;
      localStorage.setItem(key, JSON.stringify(tabs));
      sessionStorage.setItem("mb-scroll", String(window.scrollY));
    } catch (e) {}
    location.reload();
  }

  function typeset(el) {
    var M = window.MathJax;
    if (!M || !M.startup || !M.startup.promise) return;
    M.startup.promise.then(function () { return M.typesetPromise([el]); }).catch(function () {});
  }

  document.addEventListener("DOMContentLoaded", function () {
    try {
      var y = sessionStorage.getItem("mb-scroll");
      if (y !== null) { sessionStorage.removeItem("mb-scroll"); window.addEventListener("load", function () { window.scrollTo(0, +y); }); }
    } catch (e) {}

    // Inline panel (on the conventions page)
    var inline = document.getElementById("mb-settings-inline");
    if (inline) { inline.appendChild(buildForm("inline")); typeset(inline); }

    // Floating button and dialog on every page
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "mb-settings-button";
    btn.setAttribute("aria-haspopup", "dialog");
    btn.innerHTML = '<span aria-hidden="true">⚙</span> Notation';
    var dlg = document.createElement("dialog");
    dlg.className = "mb-settings-dialog";
    dlg.setAttribute("aria-labelledby", "mb-dlg-title");
    dlg.innerHTML = '<div class="mb-dlg-head"><h2 id="mb-dlg-title">Notation and code</h2>' +
      '<button type="button" class="btn-close" aria-label="Close"></button></div>' +
      '<p class="mb-dlg-intro">Choose the notation you are used to. Every page of the book, and the apps, will use it. ' +
      'See <a class="mb-conv-link">Notation and conventions</a> for what each option means.</p>';
    dlg.appendChild(buildForm("dlg"));
    document.body.appendChild(btn);
    document.body.appendChild(dlg);
    var conv = dlg.querySelector(".mb-conv-link");
    var sideLink = document.querySelector('a[href$="conventions.html"]');
    conv.href = sideLink ? sideLink.getAttribute("href") : "conventions.html";
    btn.addEventListener("click", function () { dlg.showModal(); typeset(dlg); });
    dlg.querySelector(".btn-close").addEventListener("click", function () { dlg.close(); });
    dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

    // Size embedded apps to their content (same origin)
    document.querySelectorAll("iframe.app-frame").forEach(function (f) {
      // The frame's height includes its border (box-sizing: border-box), so add the border,
      // and measure the content itself rather than scrollHeight so that the frame can shrink too.
      function fit() {
        try {
          var d = f.contentDocument; if (!d || !d.documentElement) return;
          var content = Math.ceil(d.documentElement.getBoundingClientRect().height);
          var border = f.offsetHeight - f.clientHeight;
          f.style.height = (content + border) + "px";
        } catch (e) {}
      }
      f.addEventListener("load", function () {
        fit();
        try { new ResizeObserver(fit).observe(f.contentDocument.body); } catch (e) {}
      });
    });
  });
})();
</script>
<script>
/* Accessibility fixes for markup that Quarto generates. */
document.addEventListener("DOMContentLoaded", function () {
  // Collapsible callouts ("Check your understanding"): make the header a real,
  // keyboard-operable button that announces whether the answer is shown.
  document.querySelectorAll(".callout-header[data-bs-toggle='collapse']").forEach(function (h) {
    var target = document.querySelector(h.getAttribute("data-bs-target"));
    h.setAttribute("role", "button");
    h.setAttribute("tabindex", "0");
    if (target) {
      if (!target.id) target.id = "mb-" + Math.random().toString(36).slice(2, 9);
      h.setAttribute("aria-controls", target.id);
    }
    h.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); h.click(); }
    });
  });
  // Sidebar: label the landmark, and stop section toggles posing as landmarks.
  var side = document.getElementById("quarto-sidebar");
  if (side) side.setAttribute("aria-label", "Book contents");
  document.querySelectorAll("#quarto-sidebar [data-bs-toggle='collapse'][role='navigation']").forEach(function (a) {
    a.setAttribute("role", "button");
  });
  var toc = document.querySelector("nav#TOC");
  if (toc && !toc.getAttribute("aria-label")) toc.setAttribute("aria-label", "On this page");
  // Code output that scrolls sideways must be reachable from the keyboard.
  function markScrollers() {
    var n = 0;
    document.querySelectorAll(".cell-output pre, pre.code-output, div.code-output pre").forEach(function (p) {
      if (p.scrollWidth > p.clientWidth + 1) {
        n += 1;
        p.setAttribute("tabindex", "0");
        p.setAttribute("role", "region");
        p.setAttribute("aria-label", "Code output " + n + " (scrolls sideways)");
      } else if (p.getAttribute("role") === "region") {
        p.removeAttribute("tabindex"); p.removeAttribute("role"); p.removeAttribute("aria-label");
      }
    });
  }
  markScrollers();
  window.addEventListener("resize", markScrollers);
  document.addEventListener("shown.bs.tab", markScrollers);
});
</script>
