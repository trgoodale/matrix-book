<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pivoting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: the elimination written out stage by stage, then the controls and the verdict */
:root {
  --paper: #f2f5f8; --grid: #dde4ec; --surface: #ffffff; --ink: #18222f; --muted: #5e6b7c; --line: #c9d2dd;
  --row: #2153b8; --col: #9c5208; --res: #0a7050; --tgt: #6a3db0;
  --plane: #fbfcfd; --pgrid: #e3e8ee;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161d; --grid: #1a212b; --surface: #171e27; --ink: #e4e9f0; --muted: #94a1b2; --line: #2c3644;
    --row: #74a4ff; --col: #f0a35a; --res: #43c999; --tgt: #b89cff; --plane: #131920; --pgrid: #222b36; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161d; --grid: #1a212b; --surface: #171e27; --ink: #e4e9f0; --muted: #94a1b2; --line: #2c3644;
  --row: #74a4ff; --col: #f0a35a; --res: #43c999; --tgt: #b89cff; --plane: #131920; --pgrid: #222b36; color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0; background-color: var(--paper); color: var(--ink); font: 15px/1.5 var(--font-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
[hidden] { display: none !important; }
.wrap {
  max-width: 1080px; margin: 0 auto; padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px;
}
header h1 { font: 500 clamp(1.8rem, 4vw, 2.4rem)/1.1 var(--font-display); margin: 0; text-wrap: balance; }
header h1 em { color: var(--res); }
header p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.plane-box { padding: 12px; }
.holder { width: 100%; max-width: 560px; margin: 0 auto; }
canvas { display: block; width: 100%; height: auto; border-radius: 6px; touch-action: none; }
canvas.grab { cursor: grab; } canvas.grabbing { cursor: grabbing; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; border-top: 3px solid; display: inline-block; }
.sw.a { border-color: var(--row); } .sw.b { border-color: var(--col); border-top-style: dashed; }
.sw.w { border-color: var(--res); } .sw.t { border-color: var(--tgt); border-top-style: dotted; }
.side { display: grid; gap: 14px; }
.card { padding: 14px 16px; display: grid; gap: 10px; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.coef { display: grid; grid-template-columns: auto minmax(0, 1fr) 4.6rem; align-items: center; gap: 10px; }
.coef label { font: 600 1rem var(--font-num); }
.coef label.a { color: var(--row); } .coef label.b { color: var(--col); }
input[type="range"] { width: 100%; accent-color: var(--ink); }
input[type="number"] {
  width: 100%; font: 600 0.95rem var(--font-num); color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--line); border-radius: 6px; padding: 4px 6px; text-align: center;
}
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font: 500 1rem var(--font-num); }
.colv { position: relative; display: inline-grid; padding: 3px 10px; gap: 2px; text-align: center; min-width: 3.4rem; }
.colv::before, .colv::after { content: ""; position: absolute; top: 0; bottom: 0; width: 6px; border: 1.5px solid var(--ink); }
.colv::before { left: 0; border-right: 0; } .colv::after { right: 0; border-left: 0; }
.colv.a { color: var(--row); } .colv.b { color: var(--col); } .colv.w { color: var(--res); font-weight: 600; }
.k { font-weight: 600; } .k.a { color: var(--row); } .k.b { color: var(--col); }
.op { color: var(--muted); }
button {
  font: 500 0.88rem var(--font-body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--ink); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
button:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid var(--row); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.status { font-size: 0.92rem; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); }
.status.hit { border-color: var(--res); color: var(--res); font-weight: 600; }
.status.stuck { border-color: var(--tgt); border-style: dashed; }
.hint { color: var(--muted); font-size: 0.88rem; margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
html.embedded body { background-image: none; }
html.embedded header { display: none; }
html.embedded .wrap { padding-block: 6px 10px; }
html.br-round .colv::before { border-top: 0; border-bottom: 0; width: 8px; border-radius: 100% 0 0 100% / 50% 0 0 50%; }
html.br-round .colv::after { border-top: 0; border-bottom: 0; width: 8px; border-radius: 0 100% 100% 0 / 0 50% 50% 0; }
@media (min-width: 560px) and (max-width: 860px) {
  .side { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .side > .wide { grid-column: 1 / -1; }
}

.mat { position: relative; display: inline-grid; grid-template-columns: 4.2rem 4.2rem; gap: 6px; padding: 6px 14px; }
.mat::before, .mat::after { content: ""; position: absolute; top: 0; bottom: 0; width: 7px; border: 1.5px solid var(--ink); }
.mat::before { left: 0; border-right: 0; } .mat::after { right: 0; border-left: 0; }
html.br-round .mat::before { border-top: 0; border-bottom: 0; width: 10px; border-radius: 100% 0 0 100% / 50% 0 0 50%; }
html.br-round .mat::after { border-top: 0; border-bottom: 0; width: 10px; border-radius: 0 100% 100% 0 / 0 50% 50% 0; }
.mat input { -moz-appearance: textfield; appearance: textfield; }
.mat input::-webkit-outer-spin-button, .mat input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.matrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.matrow .nm { font: 600 1.05rem var(--font-num); }
.status b { font-weight: 600; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.9rem; }
.toggles label { display: inline-flex; align-items: center; gap: 6px; }
.sw.c { border-color: var(--tgt); }

.layout.pv { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
@media (max-width: 860px) { .layout.pv { grid-template-columns: minmax(0, 1fr); } .layout.pv .side { order: -1; } }
.stage > .am { justify-self: start; }
.stages { padding: 12px 14px; display: grid; gap: 12px; }
.stage { display: grid; gap: 6px; }
.stage .cap { font-size: 0.9rem; }
.stage .cap b { font-weight: 600; }
.stage .cap code { font: 500 0.86rem var(--font-num); }
.am { position: relative; display: inline-block; padding: 4px 12px; overflow-x: auto; max-width: 100%; }
.am::before, .am::after { content: ""; position: absolute; top: 0; bottom: 0; width: 7px; border: 1.5px solid var(--ink); }
.am::before { left: 0; border-right: 0; } .am::after { right: 0; border-left: 0; }
html.br-round .am::before { border-top: 0; border-bottom: 0; width: 9px; border-radius: 100% 0 0 100% / 50% 0 0 50%; }
html.br-round .am::after { border-top: 0; border-bottom: 0; width: 9px; border-radius: 0 100% 100% 0 / 0 50% 50% 0; }
.am table { border-collapse: collapse; font: 500 0.9rem var(--font-num); }
.am td { padding: 2px 7px; text-align: right; white-space: nowrap; }
.am td.bar { border-left: 1.5px solid var(--muted); padding-left: 9px; }
.am td.piv { outline: 2px solid var(--row); outline-offset: -2px; border-radius: 4px; color: var(--row); font-weight: 600; }
.am td.big { color: var(--col); font-weight: 600; }
.am tr.sw td { background: color-mix(in srgb, var(--tgt) 12%, transparent); }
.nums { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 14px; font-size: 0.9rem; }
.nums b { font: 600 0.9rem var(--font-num); overflow-wrap: anywhere; }
.status.bad { border-color: var(--col); }
input[type="checkbox"] { flex: none; width: 1.1rem; height: 1.1rem; margin: 0 0.35rem 0 0; vertical-align: -0.2rem; }
label:has(> input[type="checkbox"]) { display: inline-flex; align-items: center; min-height: 24px; cursor: pointer; }
</style>
<script>
/* Book settings: embedded mode, brackets and theme follow the book. */
(function () {
  var root = document.documentElement, q = new URLSearchParams(location.search), s = {};
  try { s = JSON.parse(localStorage.getItem("mb-settings") || "{}") || {}; } catch (e) {}
  if (q.has("embed")) root.classList.add("embedded");
  if (q.has("lock")) root.classList.add("lock");
  if ((s.br || "round") === "round") root.classList.add("br-round");
  if (q.has("embed")) {
    try {
      var pb = parent.document.body;
      var sync = function () { root.setAttribute("data-theme", pb.classList.contains("quarto-dark") ? "dark" : "light"); };
      sync();
      new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ["class"] });
    } catch (e) {}
  }
})();
</script>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Choose the pivot, <em>keep the digits</em></h1>
    <p>Gaussian elimination on a computer that keeps only a few significant digits. Every result is rounded, just as real computers round to about 16 digits. See how a small pivot can wreck the answer, and how swapping rows saves it.</p>
  </header>

  <div class="layout pv">
    <section class="panel stages" aria-label="Elimination, stage by stage" id="stages"></section>

    <div class="side">
      <section class="panel card wide" aria-label="Settings">
        <span class="label">System</span>
        <div class="row" id="presets"></div>
        <span class="label">Digits kept</span>
        <div class="row" id="digits"></div>
        <span class="label">Pivoting</span>
        <div class="row" id="pivs"></div>
      </section>
      <section class="panel card wide" aria-label="Result">
        <span class="label">Result</span>
        <div class="nums" id="nums"></div>
        <div class="status" id="status" role="status"></div>
      </section>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PRESETS = [
    ['Tiny pivot', [[0.0001, 1, 1], [1, 1, 2]], 3],
    ['Zero pivot', [[0, 1, 1], [1, 1, 2]], 3],
    ['Three equations', [[0.001, 2, 3, 1], [-1, 3.712, 4.623, 2], [-2, 1.072, 5.643, 3]], 4],
    ['No trouble', [[4, 1, 1, 6], [1, 5, 2, 8], [1, 2, 6, 9]], 4],
    ['Badly scaled', [[30, 591400, 591700], [5.291, -6.13, 46.78]], 4]
  ];
  const DIGITS = [3, 4, 5, 6, 8, 16];
  const PIVS = [['none', 'None'], ['partial', 'Partial'], ['scaled', 'Scaled partial']];
  const S = { M: null, d: 3, piv: 'none', name: '' };

  const fl = x => S.d >= 16 || !isFinite(x) ? x : +x.toPrecision(S.d);
  function show(x) {
    if (!isFinite(x)) return x > 0 ? '∞' : x < 0 ? '−∞' : 'NaN';
    if (x === 0) return '0';
    const a = Math.abs(x), p = Math.min(S.d, 10);
    let s = (a >= 1e6 || a < 1e-4) ? x.toExponential(p - 1).replace(/\.?0+e/, 'e').replace('e+', 'e') : String(+x.toPrecision(p));
    return s.replace('-', '−');
  }
  // Solve in rounded arithmetic, recording each stage
  function eliminate(M0, mode, round) {
    const r = round ? fl : (x => x);
    const M = M0.map(row => row.map(r)), n = M.length, stages = [], scale = M.map(row => Math.max(...row.slice(0, n).map(Math.abs)));
    let maxMult = 0, maxEntry = Math.max(...M.flatMap(row => row.slice(0, n).map(Math.abs))), failed = null;
    const start = Math.max(...M.flatMap(row => row.slice(0, n).map(Math.abs)));
    stages.push({ cap: 'Start: the augmented matrix [A | b], rounded to the digits kept.', M: M.map(x => x.slice()), piv: null, sw: [] });
    for (let k = 0; k < n - 1; k++) {
      let p = k;
      if (mode === 'partial') { for (let i = k + 1; i < n; i++) if (Math.abs(M[i][k]) > Math.abs(M[p][k])) p = i; }
      else if (mode === 'scaled') { for (let i = k + 1; i < n; i++) if (Math.abs(M[i][k]) / scale[i] > Math.abs(M[p][k]) / scale[p]) p = i; }
      else if (M[k][k] === 0) { for (let i = k + 1; i < n; i++) if (M[i][k] !== 0) { failed = k; break; } }
      let cap = '';
      if (p !== k) { [M[p], M[k]] = [M[k], M[p]]; [scale[p], scale[k]] = [scale[k], scale[p]]; cap += `Swap rows ${k + 1} and ${p + 1}. `; }
      if (M[k][k] === 0) { stages.push({ cap: cap + `<b>The pivot in column ${k + 1} is 0</b>, so elimination without row swaps cannot continue.`, M: M.map(x => x.slice()), piv: [k, k], sw: p !== k ? [k, p] : [] }); return { stages, failed: true }; }
      const mults = [];
      for (let i = k + 1; i < n; i++) {
        const m = r(M[i][k] / M[k][k]); mults.push(`m${i + 1}${k + 1} = ${show(m)}`); maxMult = Math.max(maxMult, Math.abs(m));
        for (let j = k + 1; j <= n; j++) M[i][j] = r(M[i][j] - r(m * M[k][j]));
        M[i][k] = 0;
      }
      maxEntry = Math.max(maxEntry, ...M.flatMap(row => row.slice(0, n).map(Math.abs)));
      stages.push({ cap: cap + `Column ${k + 1}: pivot <b>${show(M[k][k])}</b>; multipliers <code>${mults.join(', ')}</code>.`, M: M.map(x => x.slice()), piv: [k, k], sw: p !== k ? [k, p] : [] });
    }
    if (M[n - 1][n - 1] === 0) return { stages, failed: true };
    const x = new Array(n).fill(0);
    for (let i = n - 1; i >= 0; i--) { let s = M[i][n]; for (let j = i + 1; j < n; j++) s = r(s - r(M[i][j] * x[j])); x[i] = r(s / M[i][i]); }
    return { stages, x, maxMult, growth: maxEntry / start };
  }
  function matHTML(st, n) {
    let h = '<div class="am"><table>';
    st.M.forEach((row, i) => {
      h += `<tr${st.sw.includes(i) ? ' class="sw"' : ''}>`;
      row.forEach((v, j) => { const cls = [j === n ? 'bar' : '', st.piv && st.piv[0] === i && st.piv[1] === j ? 'piv' : '', j < n && Math.abs(v) >= 1000 * Math.max(1, ...S.M.flatMap(r => r.slice(0, n).map(Math.abs))) / 10 ? 'big' : ''].filter(Boolean).join(' ');
        h += `<td${cls ? ` class="${cls}"` : ''}>${show(v)}</td>`; });
      h += '</tr>';
    });
    return h + '</table></div>';
  }
  function render() {
    const n = S.M.length, res = eliminate(S.M, S.piv, true), exact = eliminate(S.M, 'partial', false);
    $('stages').innerHTML = res.stages.map(st => `<div class="stage"><div class="cap">${st.cap}</div>${matHTML(st, n)}</div>`).join('') +
      (res.x ? `<div class="stage"><div class="cap">Back substitution, rounding every step, gives x = (${res.x.map(show).join(', ')}).</div></div>` : '');
    const st = $('status'), xs = exact.x;
    const vec = v => '(' + v.map(t => String(+t.toPrecision(6)).replace('-', '−')).join(', ') + ')';
    if (!res.x) {
      $('nums').innerHTML = `<span>True solution</span><b>${vec(xs)}</b>`;
      st.className = 'status bad'; st.innerHTML = 'Without row swaps, elimination meets a zero pivot and stops. Choose partial pivoting to swap rows.';
      return;
    }
    const err = Math.max(...res.x.map((v, i) => Math.abs(v - xs[i]))) / Math.max(...xs.map(Math.abs));
    $('nums').innerHTML = `<span>Computed x</span><b>${vec(res.x)}</b><span>True solution</span><b>${vec(xs)}</b>` +
      `<span>Relative error</span><b>${err === 0 ? '0' : err < 1e-3 ? err.toExponential(1).replace('-', '−') : (100 * err).toFixed(err >= 0.1 ? 0 : err >= 0.01 ? 1 : 2) + '%'}</b>` +
      `<span>Largest multiplier</span><b>${show(res.maxMult)}</b><span>Growth of entries</span><b>×${String(+res.growth.toPrecision(3))}</b>`;
    const unit = S.d >= 16 ? 1.1e-16 : 0.5 * Math.pow(10, 1 - S.d);
    const errOf = mode => { const r2 = eliminate(S.M, mode, true); return r2.x ? Math.max(...r2.x.map((v, i) => Math.abs(v - xs[i]))) / Math.max(...xs.map(Math.abs)) : Infinity; };
    const best = Math.min(errOf('none'), errOf('partial'), errOf('scaled'));
    const good = err <= Math.max(20 * unit, 2 * best), sensitive = best > 20 * unit;
    st.className = 'status' + (good ? ' hit' : ' bad');
    st.innerHTML = good ? (sensitive ? 'No pivoting strategy does better here: the system itself is sensitive (ill-conditioned), so more digits are needed.' : `The answer is as accurate as ${S.d >= 16 ? 'double precision' : S.d + '-digit arithmetic'} allows.`) :
      (res.maxMult > 10 ? `The answer is poor. Multipliers as large as ${show(res.maxMult)} made some entries huge, and the original numbers were lost when they were rounded together with them. ` + (S.piv === 'none' ? 'Try partial pivoting.' : S.piv === 'partial' ? 'Partial pivoting compared the column entries, but the rows are scaled very differently. Try scaled partial pivoting.' : '')
        : 'The answer has lost accuracy. ' + (S.piv === 'partial' ? 'Partial pivoting picked the largest entry in the column, but that row is scaled very differently from the others. Try scaled partial pivoting.' : S.piv === 'none' ? 'Try partial pivoting, then scaled partial pivoting.' : 'The system itself is sensitive (ill-conditioned).'));
  }
  function buttons(box, list, label, isOn, set) {
    box.innerHTML = '';
    list.forEach(it => { const b = document.createElement('button'); b.textContent = label(it); b.addEventListener('click', () => { set(it); refresh(); }); box.appendChild(b); });
    return () => box.querySelectorAll('button').forEach((b, k) => b.setAttribute('aria-pressed', String(isOn(list[k]))));
  }
  const marks = [];
  function refresh() { marks.forEach(f => f()); render(); }
  marks.push(buttons($('presets'), PRESETS, p => p[0], p => p[0] === S.name, p => { S.M = p[1].map(r => r.slice()); S.d = p[2]; S.name = p[0]; }));
  marks.push(buttons($('digits'), DIGITS, d => d === 16 ? '16 (double)' : String(d), d => d === S.d, d => { S.d = d; }));
  marks.push(buttons($('pivs'), PIVS, p => p[1], p => p[0] === S.piv, p => { S.piv = p[0]; }));

  // Optional start-up settings: ?preset=Three%20equations&digits=4&pivot=partial
  const q = new URLSearchParams(location.search);
  const start = PRESETS.find(p => p[0] === q.get('preset')) || PRESETS[0];
  S.M = start[1].map(r => r.slice()); S.d = start[2]; S.name = start[0];
  if (DIGITS.includes(+q.get('digits'))) S.d = +q.get('digits');
  if (PIVS.some(p => p[0] === q.get('pivot'))) S.piv = q.get('pivot');
  refresh();
})();
</script>
</body>
</html>
