<title>Determinant Area Explorer</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0}

/* Layout: graph-paper worksheet; the transformed plane on the left, matrix and area readout on the right */
:root {
  --paper: #f2f5f8;
  --grid: #dde4ec;
  --surface: #ffffff;
  --ink: #18222f;
  --muted: #5e6b7c;
  --line: #c9d2dd;
  --row: #2153b8;   /* image of i-hat (column 1) */
  --col: #9c5208;   /* image of j-hat (column 2) */
  --res: #0a7050;   /* positive area */
  --neg: #b0215a;   /* flipped (negative) area */
  --kc: #6a3db0;    /* image of k-hat (column 3) */
  --plane: #fbfcfd;
  --pgrid: #e3e8ee;
  --tgrid: #8fa7c9;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161d; --grid: #1a212b; --surface: #171e27; --ink: #e4e9f0; --muted: #94a1b2;
    --line: #2c3644; --row: #74a4ff; --col: #f0a35a; --res: #43c999; --neg: #f07aa8; --kc: #b89cff;
    --plane: #131920; --pgrid: #222b36; --tgrid: #4d6487; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161d; --grid: #1a212b; --surface: #171e27; --ink: #e4e9f0; --muted: #94a1b2;
  --line: #2c3644; --row: #74a4ff; --col: #f0a35a; --res: #43c999; --neg: #f07aa8; --kc: #b89cff;
  --plane: #131920; --pgrid: #222b36; --tgrid: #4d6487; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
.wrap {
  max-width: 1120px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
header h1 {
  font-family: var(--font-display); font-weight: 500; font-size: clamp(1.9rem, 4vw, 2.6rem);
  line-height: 1.1; margin: 0; text-wrap: balance;
}
header h1 em { color: var(--res); }
header p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

.layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.plane-box { padding: 12px; display: grid; gap: 10px; }
.canvas-holder { position: relative; width: 100%; }
canvas { display: block; width: 100%; height: auto; border-radius: 6px; touch-action: none; cursor: default; }
canvas.grab { cursor: grab; }
canvas.grabbing { cursor: grabbing; }
.playbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.playbar input[type="range"] { flex: 1 1 160px; accent-color: var(--ink); }
.tval { font-family: var(--font-num); font-size: 0.85rem; color: var(--muted); min-width: 6.5ch; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 0; border-top: 3px solid; display: inline-block; }
.sw.i { border-color: var(--row); }
.sw.j { border-color: var(--col); }
.sw.o { border-top: 2px dashed var(--muted); }
.sw.t { border-top: 2px solid var(--tgrid); }

.side { display: grid; gap: 14px; }
.card { padding: 16px; display: grid; gap: 12px; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.matrix-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.mname { font-family: var(--font-display); font-size: 1.5rem; font-style: italic; }
.mat {
  position: relative; display: grid; grid-template-columns: repeat(2, 4.2rem); gap: 6px; padding: 8px 14px;
}
.mat::before, .mat::after { content: ""; position: absolute; top: 0; bottom: 0; width: 8px; border: 2px solid var(--ink); }
.mat::before { left: 0; border-right: 0; border-radius: 3px 0 0 3px; }
.mat::after { right: 0; border-left: 0; border-radius: 0 3px 3px 0; }
.mat input { -moz-appearance: textfield; appearance: textfield;

  width: 100%; height: 2.5rem; text-align: center; font: 600 1.05rem var(--font-num);
  border-radius: 6px; background: var(--paper); color: var(--ink); border: 1.5px solid var(--line);
  font-variant-numeric: tabular-nums; padding: 0 2px;
}
.mat input.c1 { border-color: var(--row); color: var(--row); }
.mat input.c2 { border-color: var(--col); color: var(--col); border-style: dashed; }
.colnote { font-size: 0.85rem; color: var(--muted); max-width: 30ch; }
.colnote b.i { color: var(--row); }
.colnote b.j { color: var(--col); }

.presets { display: flex; flex-wrap: wrap; gap: 6px; }
button {
  font: 500 0.88rem var(--font-body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer;
}
button:hover { border-color: var(--ink); }
button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); min-width: 6rem; }
button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--row); outline-offset: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.9rem; }
.opts label { display: inline-flex; align-items: center; gap: 6px; }

.formula { font-family: var(--font-num); font-size: 1rem; line-height: 1.9; overflow-wrap: anywhere; }
.formula .i { color: var(--row); font-weight: 600; }
.formula .j { color: var(--col); font-weight: 600; }
.factor { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.factor .big {
  font-family: var(--font-display); font-size: 3rem; line-height: 1; color: var(--res);
  font-variant-numeric: tabular-nums;
}
.factor .big.neg { color: var(--neg); }
.factor .big.zero { color: var(--muted); }
.factor .what { color: var(--muted); font-size: 0.92rem; max-width: 26ch; }
.areas { display: grid; grid-template-columns: auto auto; gap: 4px 18px; font-size: 0.92rem; justify-content: start; }
.areas dt { color: var(--muted); }
.areas dd { margin: 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.orient {
  display: inline-flex; align-items: center; gap: 8px; font-weight: 500; font-size: 0.92rem;
  padding: 4px 10px; border-radius: 999px; justify-self: start; border: 1.5px solid currentColor;
}
.orient.pos { color: var(--res); }
.orient.neg { color: var(--neg); border-style: dashed; }
.orient.zero { color: var(--muted); border-style: dotted; }
.explain { color: var(--muted); font-size: 0.92rem; margin: 0; padding: 0 4px; max-width: 64ch; }
.explain i { font-style: italic; }
.dimbar { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; justify-self: start; max-width: 100%; }
.dimbar button { border: 0; background: transparent; font-size: 1rem; font-weight: 600; padding: 8px 16px; border-radius: 7px; display: inline-flex; align-items: baseline; gap: 8px; }
.dimbar button span { font-weight: 400; font-size: 0.85rem; color: var(--muted); }
.dimbar button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.dimbar button[aria-pressed="true"] span { color: inherit; opacity: 0.8; }
@media (max-width: 480px) { .dimbar button span { display: none; } .dimbar button { padding: 8px 22px; } }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mat { grid-template-columns: repeat(var(--n, 2), 4.2rem); }
.mat input.c3 { border-color: var(--kc); color: var(--kc); border-style: dotted; border-width: 2px; }
.sw.k { border-color: var(--kc); border-top-style: dotted; }
.colnote b.k { color: var(--kc); }
.formula .k { color: var(--kc); font-weight: 600; }
.formula .kk { font-weight: 600; }
.dimrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
canvas:focus-visible { outline: 2px solid var(--row); outline-offset: 3px; }
@media (max-width: 560px) { .mat { grid-template-columns: repeat(var(--n, 2), 3.6rem); } .formula { font-size: 0.88rem; } }

/* Book embedding: hide the page header, follow the book's bracket setting */
html.embedded body { background-image: none; }
html.embedded header { display: none; }
html.embedded .wrap { padding-block: 6px 10px; }
html.br-round .mat::before { border-top: 0; border-bottom: 0; width: 10px; border-radius: 100% 0 0 100% / 50% 0 0 50%; }
html.br-round .mat::after { border-top: 0; border-bottom: 0; width: 10px; border-radius: 0 100% 100% 0 / 0 50% 50% 0; }
html.embedded .explain { display: none; }
html.embedded .canvas-holder { max-width: 540px; margin: 0 auto; }
@media (min-width: 560px) and (max-width: 860px) {
  .layout > .side:last-child { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .layout > .side:last-child > section:last-child { grid-column: 1 / -1; }
  .layout > .side:last-child .mat { grid-template-columns: repeat(var(--n, 2), 3.4rem); }
}
.mat input::-webkit-outer-spin-button, .mat input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="checkbox"] { flex: none; width: 1.1rem; height: 1.1rem; margin: 0 0.35rem 0 0; vertical-align: -0.2rem; }
label:has(> input[type="checkbox"]) { display: inline-flex; align-items: center; min-height: 24px; cursor: pointer; }
</style>
<script>
/* Book settings: embedded mode, brackets, unit-vector names and theme follow the book. */
(function () {
  var root = document.documentElement, q = new URLSearchParams(location.search), s = {};
  try { s = JSON.parse(localStorage.getItem("mb-settings") || "{}") || {}; } catch (e) {}
  if (q.has("embed")) root.classList.add("embedded");
  if ((s.br || "round") === "round") root.classList.add("br-round");
  if (s.basis !== "hat") {
    var map = s.basis === "e" ? [[/\u00EE/g, "e\u2081"], [/\u0135/g, "e\u2082"], [/k\u0302/g, "e\u2083"]]
      : [[/\u00EE/g, "\uD835\uDC22"], [/\u0135/g, "\uD835\uDC23"], [/k\u0302/g, "\uD835\uDC24"]];
    window.mbBasis = function (t) { map.forEach(function (m) { t = t.replace(m[0], m[1]); }); return t; };
    var fix = function () {
      var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), n;
      while ((n = w.nextNode())) { var v = window.mbBasis(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
      document.querySelectorAll("[aria-label]").forEach(function (el) {
        var a = el.getAttribute("aria-label"), v = window.mbBasis(a); if (v !== a) el.setAttribute("aria-label", v);
      });
    };
    document.addEventListener("DOMContentLoaded", function () {
      fix();
      new MutationObserver(fix).observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["aria-label"] });
    });
  }
  if (q.has("embed")) {
    try {
      var pb = parent.document.body;
      var sync = function () { root.setAttribute("data-theme", pb.classList.contains("quarto-dark") ? "dark" : "light"); };
      sync();
      new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ["class"] });
    } catch (e) {}
  }
})();
</script>
</head>
<body>


<main class="wrap">
  <header>
    <h1>The determinant is the <em id="h1word">area scale factor</em></h1>
    <p id="intro"></p>
  </header>

  <div class="dimbar" id="dims" role="group" aria-label="Dimension">
    <button data-dim="2" aria-pressed="true">2D <span>area of shapes in the plane</span></button>
    <button data-dim="3" aria-pressed="false">3D <span>volume of solids in space</span></button>
  </div>

  <div class="layout">
    <div class="side">
    <section class="panel plane-box" aria-label="Transformation view">
      <div class="canvas-holder" id="holder">
        <canvas id="cv" role="img" aria-label="Plane transformed by the matrix"></canvas>
      </div>
      <div class="playbar">
        <button class="primary" id="play">Play</button>
        <label class="sr-only" for="t">Transformation progress</label>
        <input type="range" id="t" min="0" max="1" step="0.01" value="1">
        <span class="tval" id="tval">t = 1.00</span>
      </div>
      <div class="legend">
        <span><span class="sw i"></span>where î lands</span>
        <span><span class="sw j"></span>where ĵ lands</span>
        <span id="legK" hidden><span class="sw k"></span>where k̂ lands</span>
        <span><span class="sw o"></span>shape before</span>
        <span><span class="sw t"></span><span id="legGrid">transformed grid</span></span>
      </div>
    </section>
    <p class="explain" id="explain"></p>
    </div>

    <div class="side">
      <section class="panel card" aria-label="Matrix">
        <span class="label">Matrix</span>
        <div class="matrix-row">
          <span class="mname">M =</span>
          <div class="mat" id="mat"></div>
          <span class="colnote" id="colnote"></span>
        </div>
        <span class="label">Try</span>
        <div class="presets" id="presets"></div>
      </section>

      <section class="panel card" aria-label="Determinant and scale factor">
        <span class="label">Determinant</span>
        <div class="formula" id="formula"></div>
        <div class="factor"><span class="big" id="big"></span><span class="what" id="what"></span></div>
        <dl class="areas">
          <dt id="shapeName"></dt><dd id="areaBefore"></dd>
          <dt>After transformation</dt><dd id="areaAfter"></dd>
          <dt>After ÷ before</dt><dd id="ratio"></dd>
        </dl>
        <span class="orient pos" id="orient"></span>
      </section>

      <section class="panel card" aria-label="Display options">
        <span class="label">Shape</span>
        <div class="seg" id="shapes" role="group" aria-label="Shape">
          <button data-shape="unit" aria-pressed="true"></button>
          <button data-shape="round" aria-pressed="false"></button>
          <button data-shape="asym" aria-pressed="false"></button>
        </div>
        <div class="opts">
          <label><input type="checkbox" id="grid" checked> <span id="gridLbl">Transformed grid</span></label>
          <label id="snapWrap"><input type="checkbox" id="snap" checked> Snap drags to 0.5</label>
          <label id="spinWrap" hidden><input type="checkbox" id="spin"> Slow spin</label>
          <button id="resetView" hidden>Reset view</button>
        </div>
      </section>
    </div>
  </div>
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const S = {
    dim: 2, t: 1, shape: 'unit', grid: true, snap: true, spin: false,
    m2: [[2, 1], [1, 3]],
    m3: [[2, 1, 0], [0, 1.5, 0.5], [0.5, 0, 1]],
    yaw: -0.65, pitch: 0.42
  };
  const R2 = 4.6, R3 = 3.9, F = 14, LIM = 4;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = $('cv'), ctx = cv.getContext('2d');
  let W = 500, dpr = 1, drag = null, hover = null, playing = 0, spinning = 0;
  const s2 = Math.SQRT1_2;

  const PRESETS = {
    2: [
      ['Identity', [[1, 0], [0, 1]]],
      ['Stretch', [[2, 0], [0, 1.5]]],
      ['Shear', [[1, 1], [0, 1]]],
      ['Rotate 45°', [[s2, -s2], [s2, s2]]],
      ['Reflect', [[-1, 0], [0, 1]]],
      ['Flip and stretch', [[1, 2], [2, 1]]],
      ['Squash flat', [[2, 1], [2, 1]]],
      ['General', [[2, 1], [1, 3]]]
    ],
    3: [
      ['Identity', [[1, 0, 0], [0, 1, 0], [0, 0, 1]]],
      ['Stretch', [[2, 0, 0], [0, 1.5, 0], [0, 0, 1]]],
      ['Shear', [[1, 0, 1], [0, 1, 0], [0, 0, 1]]],
      ['Rotate 45° about z', [[s2, -s2, 0], [s2, s2, 0], [0, 0, 1]]],
      ['Reflect', [[-1, 0, 0], [0, 1, 0], [0, 0, 1]]],
      ['Flip and stretch', [[1, 2, 0], [2, 1, 0], [0, 0, 1.5]]],
      ['Squash flat', [[1, 0, 1], [0, 1, 1], [0, 0, 0]]],
      ['General', [[2, 1, 0], [0, 1.5, 0.5], [0.5, 0, 1]]]
    ]
  };

  const r3 = x => { const r = Math.round(x * 1000) / 1000; return Object.is(r, -0) ? 0 : r; };
  const fmt = (x, dp = 2) => { const r = Math.round(x * 10 ** dp) / 10 ** dp; return (Object.is(r, -0) ? 0 : r).toString().replace('-', '−'); };
  const paren = x => Math.round(x * 100) / 100 < 0 ? '(' + fmt(x) + ')' : fmt(x);

  const M = () => S.dim === 2 ? S.m2 : S.m3;
  const cur = () => M().map((r, i) => r.map((v, j) => (i === j ? 1 : 0) * (1 - S.t) + v * S.t));
  const ap = (m, p) => m.map(r => r.reduce((s, v, j) => s + v * p[j], 0));
  function det(m) {
    if (m.length === 2) return m[0][0] * m[1][1] - m[0][1] * m[1][0];
    const [[a, b, c], [d, e, f], [g, h, i]] = m;
    return a * (e * i - f * h) - b * (d * i - f * g) + c * (d * h - e * g);
  }
  const sub = (p, q) => p.map((v, i) => v - q[i]);
  const cross = (p, q) => [p[1] * q[2] - p[2] * q[1], p[2] * q[0] - p[0] * q[2], p[0] * q[1] - p[1] * q[0]];
  const dot = (p, q) => p.reduce((s, v, i) => s + v * q[i], 0);

  // ---------- shapes ----------
  const area = pts => { let s = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; s += p[0] * q[1] - q[0] * p[1]; } return s / 2; };
  const volume = (V, faces) => { let s = 0; for (const f of faces) for (let k = 1; k < f.length - 1; k++) s += dot(V[f[0]], cross(V[f[k]], V[f[k + 1]])); return s / 6; };
  const circ = (n, fn) => Array.from({ length: n + 1 }, (_, k) => fn(k / n * 2 * Math.PI));

  const SH2 = {
    unit: { name: 'Unit square', pts: [[0, 0], [1, 0], [1, 1], [0, 1]] },
    round: { name: 'Circle (radius 1)', pts: circ(143, a => [Math.cos(a), Math.sin(a)]).slice(0, 144) },
    asym: { name: 'Letter F', pts: [[0, 0], [0.5, 0], [0.5, 0.85], [1.1, 0.85], [1.1, 1.3], [0.5, 1.3], [0.5, 1.75], [1.3, 1.75], [1.3, 2.2], [0, 2.2]] }
  };
  function cube() {
    const V = []; for (let i = 0; i < 8; i++) V.push([i & 1, (i >> 1) & 1, (i >> 2) & 1]);
    const faces = [[0, 2, 3, 1], [4, 5, 7, 6], [0, 1, 5, 4], [2, 6, 7, 3], [0, 4, 6, 2], [1, 3, 7, 5]];
    const edges = []; for (let i = 0; i < 8; i++) for (let b = 1; b < 8; b <<= 1) if (!(i & b)) edges.push([V[i], V[i | b]]);
    return { name: 'Unit cube', V, faces, edges };
  }
  function sphere() {
    const NL = 30, NM = 60, V = [], faces = [];
    for (let i = 0; i <= NL; i++) for (let j = 0; j < NM; j++) {
      const th = i / NL * Math.PI, ph = j / NM * 2 * Math.PI;
      V.push([Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)]);
    }
    const id = (i, j) => i * NM + (j % NM);
    for (let i = 0; i < NL; i++) for (let j = 0; j < NM; j++) faces.push([id(i, j), id(i + 1, j), id(i + 1, j + 1), id(i, j + 1)]);
    const edges = [circ(64, a => [Math.cos(a), Math.sin(a), 0]), circ(64, a => [Math.cos(a), 0, Math.sin(a)]), circ(64, a => [0, Math.cos(a), Math.sin(a)])];
    return { name: 'Sphere (radius 1)', V, faces, edges, smooth: true };
  }
  function lblock() {
    const P = [[0, 0], [1.6, 0], [1.6, 0.6], [0.6, 0.6], [0.6, 2], [0, 2]], n = P.length;
    const V = [...P.map(([x, z]) => [x, 0, z]), ...P.map(([x, z]) => [x, 1, z])];
    const faces = [P.map((_, k) => k), P.map((_, k) => n + n - 1 - k)];
    const edges = [];
    for (let k = 0; k < n; k++) {
      const k2 = (k + 1) % n;
      faces.push([k, n + k, n + k2, k2]);

    const m = cur(), pts = { j: [m[0][1], m[1][1]], i: [m[0][0], m[1][0]] };
    let best = null, bd = 22;
    for (const k of ['j', 'i']) { const s = P2(pts[k]); const d = Math.hypot(s[0] - sx, s[1] - sy); if (d < bd) { bd = d; best = k; } }
    return best;
  }
  cv.addEventListener('pointerdown', e => {
    const [sx, sy] = pos(e);
    if (S.dim === 3) { drag = { key: 'view', x: sx, y: sy }; cv.setPointerCapture(e.pointerId); cv.className = 'grabbing'; e.preventDefault(); return; }
    const k = hit2(sx, sy); if (!k) return;
    stopPlay();
    if (S.t < 1) { S.m2 = cur(); setT(1); syncInputs(); }
    drag = { key: k }; cv.setPointerCapture(e.pointerId); cv.className = 'grabbing'; e.preventDefault(); draw();
  });
  cv.addEventListener('pointermove', e => {
    const [sx, sy] = pos(e);
    if (S.dim === 3) {
      if (!drag) return;
      S.yaw -= (sx - drag.x) * 0.01; S.pitch = Math.max(-1.2, Math.min(1.45, S.pitch + (sy - drag.y) * 0.01));
      drag.x = sx; drag.y = sy; draw(); return;
    }
    if (!drag) { const h = hit2(sx, sy); if (h !== hover) { hover = h; cv.className = h ? 'grab' : ''; draw(); } return; }
    const u = u2(); let x = (sx - W / 2) / u, y = (W / 2 - sy) / u;
    if (S.snap) { x = Math.round(x * 2) / 2; y = Math.round(y * 2) / 2; }
    x = Math.max(-LIM, Math.min(LIM, x)); y = Math.max(-LIM, Math.min(LIM, y));
    const col = drag.key === 'i' ? 0 : 1; S.m2[0][col] = x; S.m2[1][col] = y;
    syncInputs(); clearPreset(); update();
  });
  const end = () => { if (drag) { drag = null; cv.className = S.dim === 3 ? 'grab' : (hover ? 'grab' : ''); draw(); } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', () => { if (!drag && hover) { hover = null; cv.className = S.dim === 3 ? 'grab' : ''; draw(); } });
  cv.addEventListener('keydown', e => {
    if (S.dim !== 3) return;
    const k = { ArrowLeft: [0.12, 0], ArrowRight: [-0.12, 0], ArrowUp: [0, -0.1], ArrowDown: [0, 0.1] }[e.key];
    if (!k) return;
    e.preventDefault(); S.yaw += k[0]; S.pitch = Math.max(-1.2, Math.min(1.45, S.pitch + k[1])); draw();
  });

  new ResizeObserver(resize).observe($('holder'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts) document.fonts.ready.then(draw);

  buildInputs(); buildPresets(); dimText();
  $('presets').lastChild.setAttribute('aria-pressed', 'true');
  resize(); readout();
  // Optional start-up settings from the page address: ?dim=3&preset=Shear
  (() => {
    const q = new URLSearchParams(location.search);
    if (q.get('dim') === '3') $('dims').querySelector('[data-dim="3"]').click();
    const want = q.get('preset');
    if (want) { const b = [...$('presets').querySelectorAll('button')].find(x => x.textContent === want); if (b) b.click(); }
  })();
})();
</script>
